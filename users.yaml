profiles:
  default:
    max_memory_usage: 10000000000
    use_uncompressed_cache: 0
    load_balancing: in_order
    max_partitions_per_insert_block: 10000
    log_queries: 1

users:
  default:
    password: ""
    profile: default
    networks:
      ip: "::/0"
    quota: default
  admin:
    password: "123"
    profile: default
    networks:
      ip: "::/0"
    quota: default
    access_management: 1
  ${DBT_USER}:
    password: ${DBT_PASSWORD}
    profile: default
    networks:
      ip: "::/0"
    quota: default
    access_management: 1

quotas:
  default:
    interval:
      duration: 3600
      queries: 0
      errors: 0
      result_rows: 0
      read_rows: 0
      execution_time: 0