logger:
  level: debug
  console: true
  log:
    remove: "remove"
  errorlog:
    remove: "remove"

query_log:
  database: system
  table: query_log

listen_host: "0.0.0.0"
http_port: 8123
tcp_port: 9000
interserver_http_host: "clickhouse${REPLICA}"
interserver_http_port: 9009

max_connections: 4096
keep_alive_timeout: 3
max_concurrent_queries: 100
uncompressed_cache_size: 8589934592
mark_cache_size: 5368709120

path: /var/lib/clickhouse/
tmp_path: /var/lib/clickhouse/tmp/
user_files_path: /var/lib/clickhouse/user_files/
access_control_path: /var/lib/clickhouse/

users_config: users.xml
default_profile: default
default_database: default
timezone: Europe/Moscow
mlock_executable: false
default_replica_path: /clickhouse/tables/{uuid}/{shard}

remote_servers:
  cluster_name:
    shard:
      - replica:
          - host: clickhouse01
            port: 9000
          - host: clickhouse02
            port: 9000
          - host: clickhouse03
            port: 9000

zookeeper:
  node:
    - index: 1
      host: zookeeper
      port: 2181

macros:
  cluster_name: cluster_name
  shard: "${SHARD}"
  replica: "clickhouse${REPLICA}"

distributed_ddl:
  path: /clickhouse/task_queue/ddl

format_schema_path: /var/lib/clickhouse/format_schemas/