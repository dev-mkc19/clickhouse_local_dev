# Конфиг загрузки sources для локального ClickHouse (make migrate).
#
# modes:
#   full         — вся таблица (справочники); safety-cap если > max_bytes
#   incremental  — фильтр по date_col (from / days), затем LIMIT
#   sample       — LIMIT без даты
#   skip         — не создавать / не грузить
#
# Приоритет нижней границы даты:
#   1) from + days → max(from, today - days)
#   2) from
#   3) days → today - days
#   4) defaults.from / LOAD_FROM
#
# Лимит объёма для incremental/sample (и safety для огромных full):
#   min(max_rows, floor(max_bytes / bytes_per_row))

defaults:
  mode: sample
  max_rows: 500000
  max_bytes_mb: 200
  days: 1
  sample_limit: 10000
  from: "2026-10-13"   # раскомментируй или задай LOAD_FROM=YYYY-MM-DD

# dbt ls selector (можно переопределить env DBT_SELECT)
# source:* — все sources проекта; "+model_name" — только upstream конкретной модели
dbt_select: "source:*"

